<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alavanza Commercial Space - Register</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Font Awesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card-container">
        <!-- Left Brand / Services Section -->
        <div class="brand-side">
            <div class="logo-group">
                <div class="logo-icon">
                    <i class="fa-solid fa-water"></i>
                </div>
                <div class="logo-text">
                    <h1>Alavanza Commercial Space</h1>
                    <span>Water • Laundry • Printing</span>
                </div>
            </div>

            <div class="hero-tagline">
                <p class="main-quote">Join Us Today,</p>
                <p class="sub-quote">Manage All Services in One Portal.</p>
                <div class="divider-line"></div>
            </div>

            <div class="services-icons">
                <div class="service-item">
                    <div class="icon-circle">
                        <i class="fa-solid fa-bottle-water"></i>
                    </div>
                    <span>Water<br>Refilling</span>
                </div>

                <div class="service-item">
                    <div class="icon-circle">
                        <i class="fa-solid fa-jug-detergent"></i>
                    </div>
                    <span>Laundry</span>
                </div>

                <div class="service-item">
                    <div class="icon-circle">
                        <i class="fa-solid fa-print"></i>
                    </div>
                    <span>Printing</span>
                </div>
            </div>

            <!-- Decorative Water Splash Background Overlay -->
            <div class="water-splash-bg"></div>
        </div>

        <!-- Right Register Form Section -->
        <div class="form-side">
            <div class="form-header">
                <h2>Create Account</h2>
                <p>Sign up to book services and track orders</p>
            </div>

            <form class="login-form">
                <!-- Full Name Input -->
                <div class="input-group">
                    <div class="input-icon-left">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="fullName" placeholder="Full Name" required>
                </div>

                <!-- Email Address Input -->
                <div class="input-group">
                    <div class="input-icon-left">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <div class="input-icon-left">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" class="toggle-password" id="togglePasswordBtn">
                        <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>

                <!-- Register Submit Button -->
                <button type="submit" class="btn-signin">
                    Register Account <i class="fa-solid fa-user-check"></i>
                </button>

                <!-- Divider -->
                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Back to Sign In Button -->
                <a href="./index.html" class="btn-create" style="text-decoration: none;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Sign In
                </a>
            </form>

            <div class="form-footer">
                <p>Fast. Reliable. Convenient.</p>
                <div class="footer-accent-line"></div>
            </div>
        </div>
    </div>

    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Your Supabase credentials initialization script -->
    <script src="./supabaseClient.js"></script>

    <!-- Page Logic -->
    <script>
        // Toggle Password Visibility
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            togglePasswordIcon.classList.toggle('fa-eye', !isPassword);
            togglePasswordIcon.classList.toggle('fa-eye-slash', isPassword);
        });

        // Supabase Registration Handler
        document.querySelector('.login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: fullName
                    }
                }
            });

            if (error) {
                alert("Registration failed: " + error.message);
            } else {
                alert("Registration successful! Redirecting to login...");
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
