<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alavanza Commercial Space</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card-container">
        <div class="brand-side">
            <div class="logo-group">
                <div class="logo-icon">
                    <i class="fa-solid fa-water"></i>
                </div>
                <div class="logo-text">
                    <h1>Alavanza Commercial Space</h1>
                    <span>Water • Laundry • Printing</span>
                </div>
            </div>

            <div class="hero-tagline">
                <p class="main-quote">Join Us Today,</p>
                <p class="sub-quote">Manage All Services in One Portal.</p>
                <div class="divider-line"></div>
            </div>

            <div class="services-icons">
                <div class="service-item">
                    <div class="icon-circle">
                        <i class="fa-solid fa-bottle-water"></i>
                    </div>
                    <span>Water<br>Refilling</span>
                </div>

                <div class="service-item">
                    <div class="icon-circle">
                        <i class="fa-solid fa-jug-detergent"></i>
                    </div>
                    <span>Laundry</span>
                </div>

                <div class="service-item">
                    <div class="icon-circle">
                        <i class="fa-solid fa-print"></i>
                    </div>
                    <span>Printing</span>
                </div>
            </div>
            <div class="water-splash-bg"></div>
        </div>

        <div class="form-side">
            <div class="form-header">
                <h2>Create Account</h2>
                <p>Sign up to book services and track orders</p>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <div class="input-icon-left">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="register-full-name" name="full_name" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <div class="input-icon-left">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input type="email" id="register-email" name="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <div class="input-icon-left">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="register-password" name="password" placeholder="Password" required>
                    <button type="button" class="toggle-password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <button type="submit" class="btn-signin">
                    Register Account <i class="fa-solid fa-user-check"></i>
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <a href="./index.html" class="btn-create" style="text-decoration: none;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Sign In
                </a>
            </form>

            <div class="form-footer">
                <p>Fast. Reliable. Convenient.</p>
                <div class="footer-accent-line"></div>
            </div>
        </div>
    </div>



<script>
    const registerForm = document.querySelector('.login-form');
    const registerButton = registerForm.querySelector('.btn-signin');

    registerForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const fullName = document.getElementById('register-full-name').value.trim();
        const email = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;

        if (password.length < 8) {
            alert('Password must be at least 8 characters long.');
            return;
        }

        const originalButtonHTML = registerButton.innerHTML;
        registerButton.disabled = true;
        registerButton.textContent = 'Creating Account...';

        try {
            const response = await fetch('http://localhost:3000/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    full_name: fullName,
                    email: email,
                    password: password
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || 'Registration failed.');
            }

            alert(result.message || 'Account created successfully.');
            window.location.href = './index.html';

        } catch (error) {
            alert(error.message || 'Unable to connect to the server.');
        } finally {
            registerButton.disabled = false;
            registerButton.innerHTML = originalButtonHTML;
        }
    });
  </script>
</body>
 </html>
